# Map reuse on OmniLRS LargeScale (Site20), session B: ORB-SLAM3, DBoW2 relocalization; 30 m AGL, localize the map
# pass itself (identical images; sanity check) in the nominal map of
# configs/omnilrs_largescale_aerial_30m_b050_orbslam3_stereo_map.yaml. Relocalize mode; poses scored in session
# A's fixed map frame. See docs/results/largescale_trial.md "Map reuse across lighting".
#   sbatch -p ice-cpu --constraint=gold6226 -c 8 --mem=32G -t 1:00:00 --dependency=afterok:<session A job> scripts/slurm_slambench.sbatch run configs/omnilrs_lsmapreuse_30m_mapnominal_same_orbslam3_relocalize.yaml
name: omnilrs_lsmapreuse_30m_mapnominal_same_orbslam3_relocalize
output_root: ~/scratch/slam-bench-work/runs
work_dir: ~/scratch/slam-bench-work

dataset:
  name: omnilrs
  root: /storage/ice1/3/6/bkuang7/omnilrs/renders   # contains <sequence>/{cam0,cam1,frames.csv,gt_cam0.tum,calib.json}
  sequence: largescale_trial/ls_aerial_30m_b050

algorithm:
  name: orbslam3
  mode: stereo
  options:
    container: ~/scratch/slam-bench-work/containers/orbslam3_4452a3c_driver3.sif
  settings:
    load_map: ~/scratch/slam-bench-work/runs/omnilrs_largescale_aerial_30m_b050_orbslam3_stereo_map   # latest successful run of configs/omnilrs_largescale_aerial_30m_b050_orbslam3_stereo_map.yaml
    reuse_mode: relocalize
    orb_n_features: 1200
    stereo_th_depth: 200.0   # close/far split at 100 m depth (0.5 m baseline)
    loop_closure: true
    clahe: false
    playback_rate: 1.0
    log_features: false

execution:
  timeout_s: 1800

evaluation:
  alignment: se3
  association_max_dt_s: 0.02     # GT is exactly at frame times
  segment_max_gap_s: 0.5
  rpe:
    - {delta: 1.0, unit: m}
    - {delta: 1.0, unit: s}
  map_reuse:                     # fixed-frame scoring in session A's map (docs/evaluation.md "Map reuse")
    error_thresholds_m: [0.1, 0.25, 0.5, 1.0]
    false_relocalization_m: 0.5
    false_relocalization_deg: 15.0
    staleness_s: [1.0, 5.0]
