# Adapted variant: keyframe-referenced VO (vo_reference: keyframe) instead of LAC's
# frame-to-frame PnP, which shrinks motion on this slow rover (see results doc).
# Stanford NAV Lab Lunar Autonomy Challenge SLAM stack (SuperPoint + LightGlue stereo VO, GTSAM pose
# graph with loop closures) on LunaPolaris sequence_11; same input and evaluation as
# lunapolaris_seq11_orbslam3_stereo_lean.yaml. Needs a CUDA GPU, e.g.
#   sbatch -p coc-gpu --gres=gpu:1 scripts/slurm_slambench.sbatch run configs/lunapolaris_seq11_lac_stereo_kfvo.yaml
# See docs/results/lac_lunapolaris.md.
name: lunapolaris_seq11_lac_stereo_kfvo
output_root: ~/scratch/slam-bench-work/runs
work_dir: ~/scratch/slam-bench-work      # prepared (converted) inputs are cached under work_dir/prepared

dataset:
  name: lunapolaris
  root: ~/scratch/LunaPolaris               # contains sequence_11/{metadata.yaml,sequence_11.db3}
  sequence: sequence_11
  options:
    gt_topic: /vrpn_mocap/ZED2_camera_marker/rectified/pose   # consistent with /tf_static (see docs)
    right_row_shift_px: -1.63   # seq11 right images sit 1.63 px low (scripts/measure_stereo_row_offset.py)

algorithm:
  name: lac
  mode: stereo
  options:
    container: ~/scratch/slam-bench-work/containers/lac_26c3a2b.sif
  settings:
    playback_rate: 1.0
    keyframe_interval_s: 1.0
    loop_closure: true
    vo_reference: keyframe

execution:
  timeout_s: 7200                 # LAC re-optimizes the full pose graph at every accepted loop closure

evaluation:
  alignment: se3                 # metric stereo -> rigid alignment
  association_max_dt_s: 0.02     # mocap ~30 Hz (33 ms period); nearest sample within 20 ms
  segment_max_gap_s: 0.5
  rpe:
    - {delta: 1.0, unit: m}
    - {delta: 1.0, unit: s}
