# orbslam3 stereo on the OmniLRS LargeScale (LOLA Site20 + procedural high-res terrain) aerial trial, 30 m AGL,
# baseline test (docs/results/largescale_trial.md). Same trajectory, sun and ground (--terrain-shader bombed
# --albedo-brightness 1.0 --bright-amp 0.3) as the _v2 config; rendered with BASELINE=0.5 (0.5 m stereo baseline).
# Centre-pixel depth ~34.6 m -> disparity fx*b/Z ~3.8 px. Stereo.ThDepth 200 (in baselines) puts
# the close/far split at 100 m depth, i.e. most of the image (median depth 34 m) is 'close'.
#   sbatch -p ice-cpu --constraint=gold6226 -c 8 --mem=32G -t 1:00:00 scripts/slurm_slambench.sbatch run configs/omnilrs_largescale_aerial_30m_b050_orbslam3_stereo.yaml
name: omnilrs_largescale_aerial_30m_b050_orbslam3_stereo
output_root: ~/scratch/slam-bench-work/runs
work_dir: ~/scratch/slam-bench-work

dataset:
  name: omnilrs
  root: /storage/ice1/3/6/bkuang7/omnilrs/renders   # contains <sequence>/{cam0,cam1,frames.csv,gt_cam0.tum,calib.json}
  sequence: largescale_trial/ls_aerial_30m_b050

algorithm:
  name: orbslam3
  mode: stereo
  options:
    container: ~/scratch/slam-bench-work/containers/orbslam3_4452a3c.sif
  settings:
    orb_n_features: 1200
    stereo_th_depth: 200.0
    loop_closure: true
    clahe: false
    playback_rate: 1.0
    log_features: false

execution:
  timeout_s: 3600

evaluation:
  alignment: se3
  association_max_dt_s: 0.02     # GT is exactly at frame times
  segment_max_gap_s: 0.5
  rpe:
    - {delta: 1.0, unit: m}
    - {delta: 1.0, unit: s}
