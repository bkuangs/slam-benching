# Map reuse, session B with learned relocalization (MixVPR + LightGlue, image r6, patch 0008): final configuration with a 1-frame consistency gate.
# Template: configs/lunapolaris/map_reuse/lunapolaris_mapreuse_map11_loc01_spslam3_learnedreloc_lgfix.yaml. Map: configs/lunapolaris/lunapolaris_seq11_spslam3_stereo_map_gd_unitdesc.yaml.
# Poses are scored in session A's fixed map frame. See docs/results/map_reuse.md "Learned relocalization: fixes (r6, patch 0008)".
# + relocalization monitor (patch 0009, image r7): every 15th map-tracked frame is re-verified with the
# learned relocalization; deviation > 1.0 m / 5.0 deg resets the frame to the verified pose. See docs/results/largescale_trial.md "Relocalization monitor".
#   sbatch -p coc-gpu -q coc-ice --gres=gpu:v100:1 -c 8 --mem=32G -t 3:00:00 --dependency=afterok:<session A job> scripts/slurm_slambench.sbatch run configs/lunapolaris/map_reuse/lunapolaris_mapreuse_map11_loc01_spslam3_learnedreloc_unitdesc_anchor_gate1_monitor.yaml
name: lunapolaris_mapreuse_map11_loc01_spslam3_learnedreloc_unitdesc_anchor_gate1_monitor
output_root: ~/scratch/slam-bench-work/runs
work_dir: ~/scratch/slam-bench-work      # prepared (converted) inputs are cached under work_dir/prepared

dataset:
  name: lunapolaris
  root: ~/scratch/LunaPolaris               # contains sequence_01/{metadata.yaml,sequence_01.db3}
  sequence: sequence_01
  options:
    gt_topic: /vrpn_mocap/ZED2_camera_marker/rectified/pose   # consistent with /tf_static (see docs)

algorithm:
  name: spslam3
  mode: stereo
  options:
    container: ~/scratch/slam-bench-work/containers/spslam3_9439971_r7.sif
  settings:
    load_map: ~/scratch/slam-bench-work/runs/lunapolaris_seq11_spslam3_stereo_map_gd_unitdesc   # latest successful run of configs/lunapolaris/lunapolaris_seq11_spslam3_stereo_map_gd_unitdesc.yaml
    reuse_mode: relocalize
    learned_reloc: true          # MixVPR top-K retrieval + verification (patch 0007)
    learned_reloc_topk: 5
    learned_reloc_min_inliers: 50
    learned_reloc_consistent_frames: 1   # 1-frame gate (accept the first verified pose)
    learned_reloc_verifier: lightglue
    learned_reloc_recover_descriptors: true    # no-op with sp_unit_descriptors (the descriptors are already unit-norm)
    sp_unit_descriptors: true    # per-keypoint unit-norm SuperPoint descriptors everywhere (patch 0008);
                                 # SPmatcher thresholds 0.52 / 1.19 and BoW scale sqrt(256/1200) follow from it
    map_anchor: true             # map anchoring after relocalization (patch 0008): VO-only frames are re-registered to the
                                 # 3 nearest map keyframes with LightGlue + MLPnP, accepted if the local map then tracks
                                 # with >= 30 inliers and the correction is <= 2 m / 15 deg; log: algorithm/map_anchor.csv
    reloc_monitor: true          # relocalization monitor (patch 0009); log: algorithm/reloc_monitor.csv
    reloc_monitor_period: 15     # re-verify every 15th map-tracked frame
    reloc_monitor_max_dev_m: 1.0
    reloc_monitor_max_dev_deg: 5.0
    reloc_monitor_max_vo_s: 0.0           # off
    reloc_monitor_max_unverified_s: 0.0   # off
    sp_n_features: 1200          # = orb_n_features of the ORB-SLAM3 lean config
    sp_n_levels: 1               # SuperPoint on the full-resolution image only (SP_SLAM3 recommendation)
    # SuperPoint confidence thresholds. The SP_SLAM3 README values (0.155 / 0.055, the adapter
    # defaults) leave ~40 keypoints per LunaPolaris frame (low-texture regolith; ~90 even at 0.005),
    # far below the 500 that stereo initialisation needs, so tracking never starts. These thresholds
    # fill the same 1200-keypoint budget as ORB-SLAM3 (top-1200 NMS'd heatmap maxima, spread by the
    # oct-tree); see docs/adapter_interface.md.
    sp_ini_th: 0.00001
    sp_min_th: 0.000001
    sp_fp16: false
    lightglue: true
    lightglue_fp16: false
    stereo_th_depth: 40.0
    loop_closure: true
    clahe: false
    playback_rate: 1.0
    log_features: false

execution:
  timeout_s: 7200               # lost frames cost ~0.3 s (5 LightGlue+PnP verifications); real-time playback queues them

evaluation:
  alignment: se3                 # metric stereo -> rigid alignment
  association_max_dt_s: 0.02     # mocap ~30 Hz (33 ms period); nearest sample within 20 ms
  segment_max_gap_s: 0.5
  rpe:
    - {delta: 1.0, unit: m}
    - {delta: 1.0, unit: s}
  map_reuse:                     # fixed-frame scoring in session A's map (docs/evaluation.md "Map reuse")
    error_thresholds_m: [0.1, 0.25, 0.5, 1.0]
    false_relocalization_m: 0.5
    false_relocalization_deg: 15.0
    staleness_s: [1.0, 5.0]
