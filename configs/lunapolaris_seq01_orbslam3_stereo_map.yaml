# Map reuse, session A: orbslam3 stereo maps LunaPolaris sequence_01 and saves the atlas (save_map). Otherwise
# identical to configs/lunapolaris_seq01_orbslam3_stereo_lean.yaml. Session-B configs load it: configs/*mapreuse*_orbslam3_*.yaml.
# See docs/results/map_reuse.md.
#   sbatch -p ice-cpu --constraint=gold6226 -c 8 --mem=32G -t 3:00:00 scripts/slurm_slambench.sbatch run configs/lunapolaris_seq01_orbslam3_stereo_map.yaml
name: lunapolaris_seq01_orbslam3_stereo_map
output_root: ~/scratch/slam-bench-work/runs
work_dir: ~/scratch/slam-bench-work      # prepared (converted) inputs are cached under work_dir/prepared

dataset:
  name: lunapolaris
  root: ~/scratch/LunaPolaris               # contains sequence_01/{metadata.yaml,sequence_01.db3}
  sequence: sequence_01
  options:
    gt_topic: /vrpn_mocap/ZED2_camera_marker/rectified/pose   # consistent with /tf_static (see docs)

algorithm:
  name: orbslam3
  mode: stereo
  options:
    container: ~/scratch/slam-bench-work/containers/orbslam3_4452a3c_driver3.sif
  settings:
    save_map: true                # session A: atlas -> algorithm/atlas.osa
    orb_n_features: 1200
    stereo_th_depth: 40.0
    loop_closure: true
    clahe: false
    playback_rate: 1.0
    log_features: false

execution:
  timeout_s: 3600

evaluation:
  alignment: se3                 # metric stereo -> rigid alignment
  association_max_dt_s: 0.02     # mocap ~30 Hz (33 ms period); nearest sample within 20 ms
  segment_max_gap_s: 0.5
  rpe:
    - {delta: 1.0, unit: m}
    - {delta: 1.0, unit: s}
