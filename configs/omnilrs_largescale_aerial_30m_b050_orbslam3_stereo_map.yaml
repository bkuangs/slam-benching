# Map reuse on OmniLRS LargeScale (Site20), session A: ORB-SLAM3 maps the 30 m AGL survey (0.5 m stereo baseline,
# v2 ground shader, nominal sun az 180 / el 45) and saves the atlas. Settings as
# configs/omnilrs_lunaryard_aerial_nominal_orbslam3_stereo_map.yaml except Stereo.ThDepth (100 m / baseline). See
# docs/results/largescale_trial.md "Map reuse across lighting".
#   sbatch -p ice-cpu --constraint=gold6226 -c 8 --mem=32G -t 1:00:00 scripts/slurm_slambench.sbatch run configs/omnilrs_largescale_aerial_30m_b050_orbslam3_stereo_map.yaml
name: omnilrs_largescale_aerial_30m_b050_orbslam3_stereo_map
output_root: ~/scratch/slam-bench-work/runs
work_dir: ~/scratch/slam-bench-work

dataset:
  name: omnilrs
  root: /storage/ice1/3/6/bkuang7/omnilrs/renders   # contains <sequence>/{cam0,cam1,frames.csv,gt_cam0.tum,calib.json}
  sequence: largescale_trial/ls_aerial_30m_b050

algorithm:
  name: orbslam3
  mode: stereo
  options:
    container: ~/scratch/slam-bench-work/containers/orbslam3_4452a3c_driver3.sif
  settings:
    save_map: true                # session A: atlas -> algorithm/atlas.osa
    orb_n_features: 1200
    stereo_th_depth: 200.0   # close/far split at 100 m depth (0.5 m baseline)
    loop_closure: true
    clahe: false
    playback_rate: 1.0
    log_features: false

execution:
  timeout_s: 1800

evaluation:
  alignment: se3
  association_max_dt_s: 0.02     # GT is exactly at frame times
  segment_max_gap_s: 0.5
  rpe:
    - {delta: 1.0, unit: m}
    - {delta: 1.0, unit: s}
