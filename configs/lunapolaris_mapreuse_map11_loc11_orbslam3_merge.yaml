# Map reuse, session B: orbslam3 stereo on LunaPolaris sequence_11, reusing the atlas of configs/lunapolaris_seq11_orbslam3_stereo_map.yaml;
# multi-session mapping (new map, merged into the loaded one by place recognition). Poses are scored in session A's fixed map frame (no re-alignment).
# Submit after session A finished:
#   sbatch -p ice-cpu --constraint=gold6226 -c 8 --mem=32G -t 3:00:00 --dependency=afterok:<session A job> scripts/slurm_slambench.sbatch run configs/lunapolaris_mapreuse_map11_loc11_orbslam3_merge.yaml
name: lunapolaris_mapreuse_map11_loc11_orbslam3_merge
output_root: ~/scratch/slam-bench-work/runs
work_dir: ~/scratch/slam-bench-work      # prepared (converted) inputs are cached under work_dir/prepared

dataset:
  name: lunapolaris
  root: ~/scratch/LunaPolaris               # contains sequence_11/{metadata.yaml,sequence_11.db3}
  sequence: sequence_11
  options:
    gt_topic: /vrpn_mocap/ZED2_camera_marker/rectified/pose   # consistent with /tf_static (see docs)
    right_row_shift_px: -1.63   # seq11 right images sit 1.63 px low (scripts/measure_stereo_row_offset.py)

algorithm:
  name: orbslam3
  mode: stereo
  options:
    container: ~/scratch/slam-bench-work/containers/orbslam3_4452a3c_driver3.sif
  settings:
    load_map: ~/scratch/slam-bench-work/runs/lunapolaris_seq11_orbslam3_stereo_map   # latest successful run of configs/lunapolaris_seq11_orbslam3_stereo_map.yaml
    reuse_mode: merge
    orb_n_features: 1200
    stereo_th_depth: 40.0
    loop_closure: true
    clahe: false
    playback_rate: 1.0
    log_features: false

execution:
  timeout_s: 3600

evaluation:
  alignment: se3                 # metric stereo -> rigid alignment
  association_max_dt_s: 0.02     # mocap ~30 Hz (33 ms period); nearest sample within 20 ms
  segment_max_gap_s: 0.5
  rpe:
    - {delta: 1.0, unit: m}
    - {delta: 1.0, unit: s}
  map_reuse:                     # fixed-frame scoring in session A's map (docs/evaluation.md "Map reuse")
    error_thresholds_m: [0.1, 0.25, 0.5, 1.0]
    false_relocalization_m: 0.5
    false_relocalization_deg: 15.0
    staleness_s: [1.0, 5.0]
